name: "🚀 TechRZN Master Build"

on:
  push:
    branches:
      - main
    paths:
      - 'sources/**'
      - 'scripts/**'
      - 'manual_sources/**'
      - '.github/workflows/**'

  schedule:
    - cron: '0 4 * * *'

  workflow_dispatch:

concurrency:
  group: master-build-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🛰️ Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🛠️ Master-Liste bauen
        run: python scripts/build.py

      - name: 💾 Änderungen speichern (Commit & Push)
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: main
          commit_message: "build: Filter-Listen aktualisiert [bot]"
          file_pattern: 'blocklists/*.txt Whitelists/*.txt'
