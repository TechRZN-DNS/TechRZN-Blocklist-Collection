name: "🚀 TechRZN Master Build"

on:
  push:
    branches:
      - main
    paths:
      - 'sources/**'
      - 'scripts/**'
      - 'manual_sources/**'
      - '.github/workflows/**'

  schedule:
    - cron: '0 4 * * *'

  workflow_dispatch:

concurrency:
  group: master-build-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🛰️ Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🛠️ Master-Liste bauen
        run: python scripts/build.py

      - name: 💾 Änderungen speichern (Commit & Push)
        run: |
          git add -A blocklists/ Whitelists/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Änderungen zum Committen vorhanden."
            exit 0
          fi

          CHANGED_FILES=$(git diff --cached --name-only -- 'blocklists/*.txt' 'Whitelists/*.txt' | wc -l | tr -d ' ')
          ADDED_DOMAINS=$(git diff --cached -U0 -- 'blocklists/*.txt' 'Whitelists/*.txt' | grep -E '^\+\|\|.*\^$' | wc -l | tr -d ' ')
          REMOVED_DOMAINS=$(git diff --cached -U0 -- 'blocklists/*.txt' 'Whitelists/*.txt' | grep -E '^-\|\|.*\^$' | wc -l | tr -d ' ')
          NET_DOMAINS=$((ADDED_DOMAINS - REMOVED_DOMAINS))

          if [ "$NET_DOMAINS" -ge 0 ]; then
            NET_LABEL="+${NET_DOMAINS}"
          else
            NET_LABEL="${NET_DOMAINS}"
          fi

          COMMIT_MSG="build: ${CHANGED_FILES} Listen geändert (${NET_LABEL} Domains, +${ADDED_DOMAINS}/-${REMOVED_DOMAINS}) [bot]"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$COMMIT_MSG"
          git pull --rebase origin main
          git push origin main
